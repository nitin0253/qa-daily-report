name: QA Daily Report → Slack

on:
  # repository_dispatch is the primary trigger — fired by an external
  # cron (cron-job.org) at 21:30 UTC / 03:00 IST. Unlike GH's own
  # `schedule`, repository_dispatch runs within seconds of the API
  # call, so timing is driven by the external scheduler, not GH's
  # backlog. No `schedule` fallback: it was unreliable (15 min to 2+ h
  # lag, occasional drops) AND it would duplicate the external post on
  # days when both fire. Rely on external cron + manual dispatch.
  repository_dispatch:
    types: [daily-report]
  workflow_dispatch:
    inputs:
      target_date:
        description: 'IST date to report for (YYYY-MM-DD). Leave blank for yesterday.'
        required: false
        default: ''
      channel_override:
        description: 'Override Slack destination (channel id, DM id, or user email). Leave blank for the team channel.'
        required: false
        default: ''
      format:
        description: 'Delivery format (comma-separated subset of text,pdf,jpg)'
        required: false
        default: 'text'
        type: choice
        options:
          - text
          - pdf
          - jpg
          - 'text,pdf'
          - 'pdf,jpg'
          - 'text,pdf,jpg'
      dry_run:
        description: 'Print the message instead of posting to Slack'
        required: false
        default: 'false'

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install WeasyPrint system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libpango-1.0-0 libpangoft2-1.0-0 \
            libharfbuzz0b fonts-dejavu-core

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run report
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          # Overrides come from workflow_dispatch inputs OR
          # repository_dispatch client_payload (same keys). Blank on
          # either falls through to defaults.
          SLACK_CHANNEL:   ${{ github.event.inputs.channel_override || github.event.client_payload.channel_override || secrets.SLACK_CHANNEL }}
          TARGET_DATE:     ${{ github.event.inputs.target_date      || github.event.client_payload.target_date      || '' }}
          REPORT_FORMAT:   ${{ github.event.inputs.format           || github.event.client_payload.format           || 'text' }}
          DRY_RUN:         ${{ (github.event.inputs.dry_run == 'true' || github.event.client_payload.dry_run == true) && '1' || '' }}
        run: python report.py
