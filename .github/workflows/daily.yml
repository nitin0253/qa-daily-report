name: QA Daily Report → Slack

on:
  # Scheduling moved to the Claude cloud routine (trig_01PkbqnVFuYMhN5guYBZRPz1),
  # which calls workflow_dispatch at 03:00 IST sharp. GH Actions' own cron was
  # removed because its first-fire lag and 10-60 min load delays missed the
  # 03:15 IST morning window.
  workflow_dispatch:
    inputs:
      target_date:
        description: 'IST date to report for (YYYY-MM-DD). Leave blank for yesterday.'
        required: false
        default: ''
      channel_override:
        description: 'Override Slack destination (channel id, DM id, or user email). Leave blank for the team channel.'
        required: false
        default: ''
      format:
        description: 'Delivery format (comma-separated subset of text,pdf,jpg)'
        required: false
        default: 'text'
        type: choice
        options:
          - text
          - pdf
          - jpg
          - 'text,pdf'
          - 'pdf,jpg'
          - 'text,pdf,jpg'
      dry_run:
        description: 'Print the message instead of posting to Slack'
        required: false
        default: 'false'

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install WeasyPrint system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libpango-1.0-0 libpangoft2-1.0-0 \
            libharfbuzz0b fonts-dejavu-core

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run report
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL:   ${{ github.event.inputs.channel_override != '' && github.event.inputs.channel_override || secrets.SLACK_CHANNEL }}
          TARGET_DATE:     ${{ github.event.inputs.target_date }}
          REPORT_FORMAT:   ${{ github.event_name == 'schedule' && 'pdf' || (github.event.inputs.format || 'text') }}
          DRY_RUN:         ${{ github.event.inputs.dry_run == 'true' && '1' || '' }}
        run: python report.py
